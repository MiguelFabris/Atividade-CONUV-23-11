<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Cadastro de Clientes</h1>

        <nav class="navegacao" aria-label="Cadastros">
            <a href="index.html">Produtos</a>
            <a class="ativa" aria-current="page" href="clientes.html">Clientes</a>
            <a href="vendas.html">Vendas</a>
        </nav>

        <form id="clienteForm">
            <input type="hidden" id="id">

            <label for="nome">Nome</label>
            <input type="text" id="nome" maxlength="120" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" maxlength="160" required>

            <div class="botoes">
                <button type="submit" id="btnSalvar">Cadastrar</button>
                <button type="button" id="btnCancelar" class="secundario" hidden>
                    Cancelar edição
                </button>
            </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <h2>Clientes cadastrados</h2>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaClientes"></tbody>
            </table>
        </div>
    </main>

    <script src="clientes.js"></script>
</body>
</html>

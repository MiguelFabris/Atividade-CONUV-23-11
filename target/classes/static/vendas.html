<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Vendas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Cadastro de Vendas</h1>

        <nav class="navegacao" aria-label="Cadastros">
            <a href="index.html">Produtos</a>
            <a href="clientes.html">Clientes</a>
            <a class="ativa" aria-current="page" href="vendas.html">Vendas</a>
        </nav>

        <form id="vendaForm">
            <input type="hidden" id="id">

            <label for="dataVenda">Data da venda</label>
            <input type="datetime-local" id="dataVenda" required>

            <label for="cliente">Cliente</label>
            <select id="cliente" required>
                <option value="">Carregando clientes...</option>
            </select>

            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="1" step="1" value="1" required>

            <label for="loja">Loja da venda</label>
            <input type="text" id="loja" maxlength="120" required>

            <label for="produto">Produto</label>
            <select id="produto" required>
                <option value="">Carregando produtos...</option>
            </select>

            <label for="valorTotal">Valor da venda (R$)</label>
            <input type="number" id="valorTotal" value="0.00" step="0.01" disabled>

            <div class="botoes">
                <button type="submit" id="btnSalvar">Registrar venda</button>
                <button type="button" id="btnCancelar" class="secundario" hidden>
                    Cancelar edição
                </button>
            </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <h2>Vendas cadastradas</h2>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data</th>
                        <th>Cliente</th>
                        <th>Loja</th>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Valor total</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaVendas"></tbody>
            </table>
        </div>
    </main>

    <script src="vendas.js"></script>
</body>
</html>
